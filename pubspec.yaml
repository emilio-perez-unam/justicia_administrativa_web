  uuid: ^4.5.1
  flexify: ^2.1.1
  device_info_plus: ^10.1.2
  easy_debounce: ^2.0.3
  fuzzy: ^0.5.0

  # Markdown
  flutter_markdown: ^0.7.5
  auto_size_text: ^3.0.0
  google_nav_bar: ^5.0.7

dev_dependencies:
  flutter_test:
