name: justicia_administrativa_web
description: "Modern legal tech platform with AI solutions for administrative law"
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter

  # Core UI
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  
  # Navigation & Routing
  go_router: ^16.1.0
  url_strategy: ^0.3.0
  
  # State Management
  flutter_riverpod: ^2.6.1
  provider: ^6.1.5
  flutter_hooks: ^0.21.2
  rxdart: ^0.28.0
  
  # Animations & Effects
  flutter_animate: ^4.5.2
  animated_text_kit: ^4.2.3
  lottie: ^3.3.2
  flutter_staggered_animations: ^1.1.1
  shimmer: ^3.0.0
  glassmorphism: ^3.0.0
  glass_kit: ^4.0.1
  
  # Responsive Design
  flutter_screenutil: ^5.9.3
  responsive_builder: ^0.7.1
  responsive_sizer: ^3.3.1
  auto_size_text: ^3.0.0
  
  # Layout & Widgets
  flutter_layout_grid: ^2.0.8
  flutter_staggered_grid_view: ^0.7.0
  carousel_slider: ^5.1.1
  expandable: ^5.0.1
  flutter_slidable: ^4.0.0
  sliver_tools: ^0.2.12
  visibility_detector: ^0.4.0+2
  
  # Forms & Input
  reactive_forms: ^18.1.1
  flutter_rating_bar: ^4.0.1
  
  # Media & Assets
  flutter_svg: ^2.2.0
  cached_network_image: ^3.4.1
  
  # Data Models
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0
  equatable: ^2.0.7
  
  # Networking
  http: ^1.5.0
  dio: ^5.7.0
  
  # Utilities
  url_launcher: ^6.3.1
  intl: ^0.20.2
  collection: ^1.19.0
  path: ^1.9.1
  
  # Maps (if needed)
  flutter_map: ^8.1.1
  latlong2: ^0.9.1
  
  # Email & Communication
  mailer: ^6.1.0
  
  # Additional Features
  share_plus: ^10.1.2
  flutter_local_notifications: ^18.0.1
  permission_handler: ^11.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  
  # Code Quality
  flutter_lints: ^6.0.0
  
  # Code Generation
  build_runner: ^2.5.1
  freezed: ^2.5.7
  json_serializable: ^6.8.0
  
  # Testing
  mockito: ^5.4.4
  bloc_test: ^9.1.7
  
  # Development Tools
  flutter_launcher_icons: ^0.14.2
  flutter_native_splash: ^2.4.2

# Flutter launcher icons configuration
flutter_launcher_icons:
  android: true
  ios: true
  web:
    generate: true
    image_path: "assets/icons/app_icon.png"
    background_color: "#1B3A57"
    theme_color: "#D4AF37"
  windows:
    generate: true
    image_path: "assets/icons/app_icon.png"

# Flutter configuration
flutter:
  # Material Design icons
  uses-material-design: true

  # Asset configuration
  assets:
    - assets/images/
    - assets/images/blog/
    - assets/images/team/
    - assets/images/services/
    - assets/icons/
    - assets/fonts/
    - assets/animations/
    - assets/documents/
    
  # Custom fonts (optional - you can use Google Fonts instead)
  # fonts:
  #   - family: Poppins
  #     fonts:
  #       - asset: assets/fonts/Poppins-Regular.ttf
  #       - asset: assets/fonts/Poppins-Medium.ttf
  #         weight: 500
  #       - asset: assets/fonts/Poppins-SemiBold.ttf
  #         weight: 600
  #       - asset: assets/fonts/Poppins-Bold.ttf
  #         weight: 700
  #   - family: Inter
  #     fonts:
  #       - asset: assets/fonts/Inter-Regular.ttf
  #       - asset: assets/fonts/Inter-Medium.ttf
  #         weight: 500
  #       - asset: assets/fonts/Inter-SemiBold.ttf
  #         weight: 600
  #       - asset: assets/fonts/Inter-Bold.ttf
  #         weight: 700

# Platform specific configurations
flutter_native_splash:
  color: "#1B3A57"
  image: assets/images/splash_logo.png
  android: true
  ios: true
  web: true
  
# Dependency overrides (if needed for version conflicts)
