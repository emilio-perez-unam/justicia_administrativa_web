name: justicia_administrativa_site
description: "Website for JusticIAdministrativa: legal services and advanced technology solutions."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.3

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # UI & Assets
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.2
  lucide_icons: ^0.257.0
  flutter_svg: ^2.2.3
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  lottie: ^3.1.2
  rive: ^0.13.15
  gap: ^3.0.1
  animations: ^2.0.11
  command_palette: ^0.3.0
  tutorial_coach_mark: ^1.2.10
  fl_chart: ^0.69.0
  sliver_tools: ^0.2.12
  confetti: ^0.7.0
  loading_animation_widget: ^1.2.0
  qr_flutter: ^4.1.0
  badges: ^3.1.2

  # Export & System
  excel: ^4.0.0
  share_plus: ^10.0.0
  add_2_calendar: ^3.0.1
  flutter_local_notifications: ^18.0.1
  cross_file: ^0.3.0

  # Desktop & Productivity
  desktop_drop: ^0.4.4
  context_menus: ^1.0.1

  # AI & Cognitive
  google_generative_ai: ^0.4.4
  speech_to_text: ^6.6.1
  
  # Security
  flutter_secure_storage: ^10.0.0
  local_auth: ^2.1.8
  email_validator: ^2.1.17
  
  # I18n
  easy_localization: ^3.0.3

  # Theme & UI
  flex_color_scheme: ^7.3.1

  # Document Generation
  pdf: ^3.10.8
  printing: ^5.11.1

  # Forms
  reactive_forms: ^17.0.0

  # Persistence
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  flutter_cache_manager: ^3.3.1

  # State Management & Architecture
  flutter_riverpod: ^2.6.1
  flutter_hooks: ^0.20.5
  hooks_riverpod: ^2.6.1
  get_it: ^8.0.0
  
  # Networking
  dio: ^5.7.0
  dio_smart_retry: ^6.0.0
  connectivity_plus: ^6.1.1
